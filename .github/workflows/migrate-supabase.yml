name: Migrate Supabase Database

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Diagnose Supabase database reachability
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import socket
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["DATABASE_URL"])
          host = url.hostname
          port = url.port or 5432

          if not host:
              raise SystemExit("DATABASE_URL has no database host")

          print(f"DB host: {host}")
          print(f"DB port: {port}")

          addresses = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
          print(f"DNS addresses: {len(addresses)}")

          for family, _, _, _, sockaddr in addresses:
              address = sockaddr[0]
              print(f"Testing {address}:{port}")
              try:
                  with socket.create_connection((address, port), timeout=10):
                      print("TCP: reachable")
                      break
              except OSError as exc:
                  print(f"TCP failed: {exc}")
          else:
              raise SystemExit("TCP: unable to reach database host")
          PY

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run prisma:deploy -w backend
