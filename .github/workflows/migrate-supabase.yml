name: Migrate Supabase Database

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Find working Supabase session pooler
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
           import re
          import socket
          import subprocess
          import sys
          from urllib.parse import urlsplit

          original = os.environ["DATABASE_URL"]
          parsed = urlsplit(original)
          original_host = parsed.hostname or ""

          match = re.fullmatch(
              r"aws-\d+-(?Pregion>.+)\.pooler\.supabase\.com",
              original_host,
          )
          if not match:
              raise SystemExit(
                  f"Expected a Supabase shared pooler hostname, got: {original_host}"
              )

          region = match.group("region")
          password = parsed.password or ""

          print(f"Supabase region: {region}")

          for index in range(10):
              host = f"aws-{index}-{region}.pooler.supabase.com"

              try:
                  socket.getaddrinfo(host, 5432, type=socket.SOCK_STREAM)
              except OSError:
                  print(f"Pooler {index}: DNS unavailable")
                  continue

              print(f"Pooler {index}: DNS available; trying Prisma migration")

              candidate = original.replace(original_host, host, 1)
              env = os.environ.copy()
              env"[DATABASE_URL"] = candidate

              result = subprocess.run(
                  ["npm", "run", "prisma:deploy", "-w", "backend"],
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )

              output = result.stdout.replace(password, "***")

              if result.returncode == 0:
                  print(output)
                  print(f"SUCCESS: Supabase pooler index {index}")
                  sys.exit(0)

              print(f"Pooler {index}: Prisma migration failed")
              safe_lines = output.strip().splitlines()
              for line in safe_lines[-8:]:
                  print(line)

          raise SystemExit(
              "No working Supabase shared session pooler was found for this region."
          )
          PY
