name: Migrate Supabase Database

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Supabase host through HTTPS DNS
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          HOST="$(node -e "process.stdout.write(new URL(process.env.DATABASE_URL).hostname)")"
          PORT="$(node -e "process.stdout.write(new URL(process.env.DATABASE_URL).port || '5432')")"

          echo "Supabase host: $HOST"
          echo "Supabase port: $PORT"

          DNS_JSON="$(curl --fail --silent --show-error --retry 3 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=${HOST}&type=A")"

          IP="$(printf '%s' "$DNS_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);const a=(j.Answer||[]).find(x=>x.type===1&&x.data);if(!a)process.exit(1);process.stdout.write(a.data)})")"

          test -n "$IP"
          echo "Resolved IPv4: $IP"
          echo "$IP $HOST" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "$HOST"
          python3 -c "import socket; s=socket.create_connection(('HOST',$PORT),timeout=10); s.close(); print('TCP: reachable')"

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run prisma:deploy -w backend
