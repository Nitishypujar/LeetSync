name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  docker-stack:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=3000
          DATABASE_URL=postgresql://leetsync:leetsync@postgres:5432/leetsync?schema=public
          SESSION_SECRET=ci-session-secret-at-least-32-characters-long
          TOKEN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GITHUB_CLIENT_ID=ci-placeholder
          GITHUB_CLIENT_SECRET=ci-placeholder
          GITHUB_CALLBACK_URL=http://localhost:3000/api/auth/github/callback
          FRONTEND_ORIGIN=http://localhost:5173
          EOF

      - name: Build containers
        run: docker compose build

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Apply database migration
        run: docker compose run --rm api npm run db:deploy

      - name: Start API and worker
        run: docker compose up -d api worker

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api worker
          exit 1

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Show API and worker logs
        if: always()
        run: docker compose logs --no-color api worker

      - name: Tear down stack
        if: always()
        run: docker compose down -v
