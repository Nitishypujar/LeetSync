name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leetsync
          POSTGRES_PASSWORD: leetsync
          POSTGRES_DB: leetsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leetsync -d leetsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://leetsync:leetsync@localhost:5432/leetsync?schema=public
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GITHUB_CLIENT_ID: ci-client
      GITHUB_CLIENT_SECRET: ci-client-secret
      GITHUB_CALLBACK_URL: http://localhost:3000/api/auth/github/callback
      FRONTEND_ORIGIN: http://localhost:5173
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run db:deploy
      - run: npm run ci

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API and worker image
        run: docker build -f backend/Dockerfile -t leetsync-api .
      - name: Build dashboard image
        run: >-
          docker build -f frontend/Dockerfile
          --build-arg VITE_API_BASE_URL=https://leetsync-nitishypujar.onrender.com
          -t leetsync-frontend .
