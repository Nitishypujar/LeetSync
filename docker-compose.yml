services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leetsync
      POSTGRES_PASSWORD: leetsync
      POSTGRES_DB: leetsync
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leetsync -d leetsync']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    env_file: [.env]
    environment:
      NPM_CONFIG_CACHE: /tmp/npm-cache
    depends_on:
      postgres: { condition: service_healthy }
    command: ['npm', 'run', 'prisma:deploy', '-w', 'backend']
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    restart: 'no'

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      EXTENSION_ID: ${EXTENSION_ID:-nadlcboffmafknogdcgohdcledaomppo}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      EXTENSION_ID: ${EXTENSION_ID:-nadlcboffmafknogdcgohdcledaomppo}
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ['node', 'backend/dist/worker.js']
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_EXTENSION_ID: ${VITE_EXTENSION_ID:-nadlcboffmafknogdcgohdcledaomppo}
    depends_on:
      api: { condition: service_healthy }
    ports: ['127.0.0.1:5173:80']

volumes:
  postgres_data:
